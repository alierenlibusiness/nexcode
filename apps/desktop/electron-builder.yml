appId: com.nexcode.desktop
productName: NEXCODE
copyright: Copyright © 2026 NEXCODE

directories:
  output: ../../release
  buildResources: build

# Derlenmiş main/preload + renderer statik export'u paketlenir.
files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../renderer/out
    to: renderer/out

win:
  target:
    - target: nsis
      arch: [x64]
    - target: msi
      arch: [x64]
  # Üretim için code-signing sertifikası burada yapılandırılır (PRD §21).

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  # Notarization için gerekli (PRD §21, Faz 2 macOS paketleme):
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

# Notarization: electron-builder, APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
# ortam değişkenleri (veya notarytool keychain profili) varsa otomatik notarize eder.
notarize: true

# NOT: pnpm monorepo'da paketleme için node-linker=hoisted veya
# `--config.nodeGypRebuild=false` + native modüllerin Electron ABI'sine
# rebuild'i gerekir. İmzalı installer üretimi sertifika + Apple Developer hesabı gerektirir (PRD §21).
