appId: com.nexcode.desktop
productName: NEXCODE
copyright: Copyright © 2026 NEXCODE

# Native modül (better-sqlite3) Electron ABI'sine `pnpm rebuild:electron` ile önceden
# hazırlanır; electron-builder'ın node-gyp rebuild'i (build araçları gerektirir) kapalı.
npmRebuild: false

# @napi-rs/keyring platform .node'unu paket dizinine kopyalar (pnpm optional dep sorunu).
beforePack: scripts/before-pack.cjs

# Tüm native binary'ler asar dışına çıkarılır (require edilebilmesi için).
asarUnpack:
  - "**/*.node"

directories:
  output: ../../release
  buildResources: build

# Derlenmiş main/preload + renderer statik export'u paketlenir.
files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../renderer/out
    to: renderer/out

# Uygulama ikonu: Windows için gerçek .ico (NSIS installer ikonları .png kabul etmez).
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: msi
      arch: [x64]
  # Üretim için code-signing sertifikası burada yapılandırılır (PRD §21).

# Sihirbazlı (assisted) NSIS installer: kullanıcı profiline kurar (admin gerekmez).
nsis:
  oneClick: false # sihirbaz sayfalarını göster
  perMachine: false # makine geneli değil, kullanıcı profili (%LOCALAPPDATA%\Programs\NEXCODE)
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NEXCODE
  artifactName: NEXCODE-Setup-${version}.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico

msi:
  artifactName: NEXCODE-${version}.${ext}

mac:
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  # Notarization için gerekli (PRD §21, Faz 2 macOS paketleme):
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID ortam değişkenleri varsa notarize eder.
  notarize: true

# NOT: pnpm monorepo'da paketleme için native modüllerin (better-sqlite3) Electron ABI'sine
# rebuild'i gerekir (pnpm dev / rebuild:electron bunu yapar). İmzalı installer üretimi
# sertifika + (macOS için) Apple Developer hesabı gerektirir (PRD §21).
