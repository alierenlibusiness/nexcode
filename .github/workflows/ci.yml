name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Proje genelinde em dash (U+2014) yasaktır; sonradan geri sızmasını bu adım engeller.
      # Desen hex kaçışıyla yazılır, aksi halde bu dosya kendi kuralını ihlal ederdi.
      - name: Em dash check
        run: |
          if git ls-files -z | xargs -0 grep -lP '\x{2014}' 2>/dev/null; then
            echo "::error::Yukarıdaki dosyalar em dash (U+2014) iceriyor. Iki nokta, noktali virgul veya parantez kullanin."
            exit 1
          fi
          echo "Em dash bulunamadi."

      - name: Build (core first, then apps)
        run: pnpm -r build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Dependency audit (high)
        run: pnpm audit --audit-level high
        continue-on-error: true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (secret-leak taraması)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
